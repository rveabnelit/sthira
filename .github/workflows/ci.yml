name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Проверка типов
        run: pnpm typecheck

      - name: Сборка
        run: pnpm build

      - name: Smoke-тест критичных сценариев
        run: |
          pnpm start > /tmp/sthira.log 2>&1 &
          node -e "
            const url = 'http://127.0.0.1:3100/';
            const started = Date.now();
            const tick = async () => {
              try { const r = await fetch(url); if (r.ok) process.exit(0); } catch {}
              if (Date.now() - started > 60000) { console.error('server timeout'); process.exit(1); }
              setTimeout(tick, 1000);
            };
            tick();
          "
          pnpm test:smoke
